name: Deploy Ocelot Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/web.yml'
      - 'app-web/**'
      - 'src/**'
      - 'web/**'
      - 'package.yaml'
      - '*.cabal'
      - 'Makefile'
      - 'stack.yaml'
      - 'stack.yaml.lock'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install wasm toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip zstd

      # FLAVOUR 9.6 is off the table: its wasm code generator miscompiled the
      # CPU core (INC (HL) lost the Z flag on the 0xFF wrap, among others), so
      # every native test passed while the deployed emulator drifted off the
      # hardware timeline. The blargg check below guards against a relapse.
      - name: Cache GHC wasm toolchain
        id: cache-wasm
        uses: actions/cache@v4
        with:
          path: ~/.ghc-wasm
          key: ${{ runner.os }}-ghc-wasm-9.12-${{ hashFiles('.github/workflows/web.yml') }}

      - name: Install GHC wasm toolchain
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: curl https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/raw/master/bootstrap.sh | FLAVOUR=9.12 sh

      - name: Expose GHC wasm toolchain
        run: ~/.ghc-wasm/add_to_github_path.sh

      - name: Build web bundle
        run: make web-build

      - name: Fetch blargg test ROMs
        run: git submodule update --init external/gb-test-roms

      # Run the CPU test ROMs against the actual wasm artifact. The desktop
      # test suite only ever exercises the native build; this is the gate that
      # catches a wasm-backend miscompilation before it deploys.
      - name: Check the wasm CPU against blargg ROMs
        run: node tools/wasm-cpu-check.mjs dist/web/ocelot.wasm external/gb-test-roms/cpu_instrs/individual/*.gb

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

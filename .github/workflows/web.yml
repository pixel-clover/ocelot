name: Deploy Ocelot Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
      #- develop
    paths:
      - '.github/workflows/web.yml'
      - 'app-web/**'
      - 'src/**'
      - 'web/**'
      - 'package.yaml'
      - '*.cabal'
      - 'Makefile'
      - 'stack.yaml'
      - 'stack.yaml.lock'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  WASM_FLAVOUR: '9.12'
  WASM_META_REV: ce99eb6bc65d935ee5cb0e7563deb893793dc947

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install wasm toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip zstd

      - name: Cache GHC wasm toolchain
        id: cache-wasm
        uses: actions/cache@v4
        with:
          path: ~/.ghc-wasm
          key: ${{ runner.os }}-ghc-wasm-${{ env.WASM_FLAVOUR }}-${{ env.WASM_META_REV }}

      - name: Install GHC wasm toolchain
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: |
          curl -sSf "https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/raw/${WASM_META_REV}/bootstrap.sh" \
            | FLAVOUR="$WASM_FLAVOUR" sh

      - name: Expose GHC wasm toolchain
        run: ~/.ghc-wasm/add_to_github_path.sh

      - name: Build web bundle
        run: make web-build

      - name: Fetch blargg test ROMs
        run: git submodule update --init external/gb-test-roms

      - name: Check the wasm CPU against blargg ROMs
        run: node tools/wasm-cpu-check.mjs dist/web/ocelot.wasm external/gb-test-roms/cpu_instrs/individual/*.gb

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Create Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call_tests:
    uses: ./.github/workflows/tests.yml

  create-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: call_tests
    if: success()
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release tag
        id: set-tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=draft-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set-tag.outputs.tag }}
          name: Release ${{ steps.set-tag.outputs.tag }}
          draft: true
          prerelease: false

  build-and-upload:
    name: Build (${{ matrix.artifact_name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ocelot-linux-x86_64.gz
          - os: ubuntu-24.04-arm
            artifact_name: ocelot-linux-aarch64.gz
          - os: macos-14
            artifact_name: ocelot-macos-aarch64.gz
          - os: windows-latest
            artifact_name: ocelot-windows-x86_64.zip
            allow_failure: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-${{ runner.arch }}-stack-release-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-stack-release-
            ${{ runner.os }}-${{ runner.arch }}-stack-

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsdl2-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          stack exec -- pacman -Syu --noconfirm
          stack exec -- pacman -S --needed --noconfirm \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-SDL2 \
            mingw-w64-x86_64-pkg-config
          # Expose pkg-config.exe to subsequent steps (Cabal configure looks for it in PATH)
          stack exec -- sh -c 'cygpath -w /mingw64/bin' >> "$GITHUB_PATH"
          # MSYS2's libSDL2main.a is built with GCC -fstack-protector, so it
          # references __stack_chk_fail and __stack_chk_guard. GHC 9.6 on Windows
          # links with Clang/LLD, and adding a plain -lssp does not help: the first
          # libssp.a on the search path is the one bundled inside the GHC tree, and
          # that archive is an empty compatibility stub, so both symbols stay
          # undefined. Build a uniquely named archive that defines them, and patch
          # SDL2's pkg-config metadata so every Cabal link that pulls in SDL2main
          # pulls the shim in as well.
          stack exec -- sh -c '
            set -eux
            printf "%s\n" \
              "#include <stdlib.h>" \
              "void *__stack_chk_guard = (void *)0x00000aff0d0a0000ULL;" \
              "void __stack_chk_fail(void) { abort(); }" > /tmp/ssp_shim.c
            /mingw64/bin/gcc -c -fno-stack-protector /tmp/ssp_shim.c -o /tmp/ssp_shim.o
            /mingw64/bin/ar rcs /mingw64/lib/libssp_shim.a /tmp/ssp_shim.o
            /mingw64/bin/nm /mingw64/lib/libssp_shim.a | grep -q "T __stack_chk_fail"
            pc="$(/mingw64/bin/pkg-config --variable=pcfiledir sdl2)/sdl2.pc"
            cp "$pc" "$pc.bak"
            if ! grep -q -- "-lssp_shim" "$pc"; then
              sed -i "s/-lSDL2main/-lSDL2main -lssp_shim/g" "$pc"
            fi
            /mingw64/bin/pkg-config --libs sdl2
          '

      - name: Build release binary
        shell: bash
        run: |
          stack build ocelot:exe:ocelot --ghc-options="-O2" --flag ocelot:desktop

      - name: Package artifact (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="$(stack path --local-install-root)/bin/ocelot"
          gzip -c "$BIN" > "${{ matrix.artifact_name }}"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = "$(stack path --local-install-root)\bin"
          $releaseDir = "release-${{ github.run_id }}"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item "$binDir\ocelot.exe" "$releaseDir\"
          # Bundle SDL2.dll from the MSYS2 sysroot that Stack manages
          $sdl2 = stack exec -- sh -c "find /mingw64/bin -name 'SDL2.dll' 2>/dev/null | head -1"
          if ($sdl2) { Copy-Item $sdl2 "$releaseDir\" }
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ./${{ matrix.artifact_name }}

  build-image:
    name: Build Docker image
    needs: call_tests
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch blargg test ROMs
        run: git submodule update --init external/gb-test-roms

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ocelot-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=develop,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Check the wasm CPU against blargg ROMs
        run: |
          set -euo pipefail
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          if [ -z "$image" ]; then
            echo "No image tag was produced, so there is nothing to check." >&2
            exit 1
          fi
          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker cp "$cid:/usr/share/nginx/html/ocelot.wasm" ./ocelot.wasm
          node tools/wasm-cpu-check.mjs ./ocelot.wasm external/gb-test-roms/cpu_instrs/individual/*.gb

      - name: Push image
        run: echo '${{ steps.meta.outputs.tags }}' | xargs -r -n1 docker push
